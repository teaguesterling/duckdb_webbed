name: Pre-commit Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-test:
    name: Format Check & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: devenv

      - name: Install devenv
        run: |
          nix profile install --accept-flake-config nixpkgs#devenv

      # The devenv.lock pins the `devenv` MODULE-SET node (cachix/devenv,
      # dir src/modules) to a rev from 2025-10, ~11 months stale vs the CLI
      # installed above. That skew is what makes `devenv shell` fail with
      # `dotenv.resolved has no value defined`. Realign JUST that node to the
      # installed CLI (targeted `devenv update devenv`; fall back to the full
      # update only if the CLI can't target the implicit input). Instrumented
      # so the before/after lock rev makes the result decisive either way.
      # Non-fatal: the Build step below is the real pass/fail signal.
      - name: Realign stale devenv module-set lock node
        run: |
          echo "=== devenv version / path ==="
          devenv version || true
          command -v devenv || true
          echo "=== devenv.lock 'devenv' node BEFORE ==="
          python3 -c "import json;n=json.load(open('devenv.lock'))['nodes'].get('devenv',{}).get('locked',{});print('rev=',n.get('rev'),'lastModified=',n.get('lastModified'))" || true
          echo "=== realign: targeted 'devenv update devenv', else full 'devenv update' ==="
          devenv update devenv || devenv update || echo "WARN: devenv update failed (likely the same dotenv eval) — Build step will show the real state"
          echo "=== devenv.lock 'devenv' node AFTER ==="
          python3 -c "import json;n=json.load(open('devenv.lock'))['nodes'].get('devenv',{}).get('locked',{});print('rev=',n.get('rev'),'lastModified=',n.get('lastModified'))" || true

      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/Microsoft/vcpkg.git
          fi
          if [ ! -f "vcpkg/vcpkg" ]; then
            ./vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Cache build directory
        uses: actions/cache@v3
        with:
          path: build/release
          key: ${{ runner.os }}-build-${{ hashFiles('src/**', 'CMakeLists.txt', 'vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build project
        run: |
          devenv shell bash -c "make release GEN=ninja VCPKG_TOOLCHAIN_PATH=\$(pwd)/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Install pre-commit hooks
        run: |
          devenv shell bash -c "pre-commit install"

      - name: Run clang-format check
        run: |
          devenv shell bash -c "pre-commit run clang-format --all-files"

      - name: Run unit tests
        run: |
          devenv shell bash -c "make test"
