#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compatibility canary: builds against DuckDB main to give advance warning
  # of upstream API changes. It is EXPECTED to go red whenever main breaks an API this
  # extension uses -- the shippable build is the stable job below.
  #
  # It runs ONLY on pushes to main. Skipping pull_request alone is not enough: pushing
  # to a branch fires a push run AND a pull_request run against the same commit, and a
  # PR's check rollup includes both, so the canary would still show red on every PR.
  #
  # `if` rather than `continue-on-error`: a job calling a REUSABLE WORKFLOW accepts only
  # name/needs/if/permissions/uses/with/secrets/strategy/concurrency, and adding
  # continue-on-error makes the whole workflow fail to PARSE.
  #
  # Currently red on the DuckDB main bind-signature change
  # (unique_ptr<FunctionData> conversions in xml_reader_functions.cpp).
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Same cp1252 reporter crash as the stable job (see below) —
      # duckdb's scripts/ci/run_tests.py emits U+274C ❌ on test-batch
      # failure and Windows' default cp1252 stdout can't encode it,
      # masking the actual test result. Only windows_amd64_mingw is
      # affected; windows_amd64 (MSVC) is re-enabled. Excluded until
      # upstream sets PYTHONIOENCODING / utf8_mode on the mingw runner.
      exclude_archs: 'windows_amd64_mingw'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.4
    with:
      # Build target is the v1.5.4 release TAG (loadable/shippable artifacts),
      # even though the duckdb/extension-ci-tools submodule pointers track the
      # v1.5-variegata branch tip. Branch-tip (-dev) builds produce
      # non-loadable extensions; the shippable stable build stays on the tag.
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # windows_amd64_mingw excluded on the v1.5.4 stable job: duckdb's
      # scripts/ci/run_tests.py prints a U+274C ❌ glyph on test-batch failure,
      # which Windows' default cp1252 stdout can't encode (UnicodeEncodeError),
      # masking the underlying test result. mingw-specific (see duckdb_urlpattern's
      # exclude list); windows_amd64 (MSVC) is re-enabled here.
      # Revisit once upstream sets PYTHONIOENCODING / utf8_mode in the runner.
      exclude_archs: 'windows_amd64_mingw'

  # Guards against the LINKED_LIBS class of WASM bug (issue #96): the reusable
  # distribution workflow builds and uploads the .wasm but never inspects or
  # loads it, so a side module with unresolved libxml2/zlib symbols ships green.
  # Two layers (see test/wasm/):
  #   1. static symbol check (hard gate) — no duckdb-wasm runtime needed.
  #   2. live load+query in duckdb-wasm (informational / continue-on-error) —
  #      expected-red until official duckdb-wasm ships v1.5.4 (the only public
  #      v1.5.4 engine, haybarn, uses a newer emscripten -> lseek ABI skew).
  wasm-load-test:
    name: WASM load test
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webbed-v1.5.4-extension-wasm_*
          path: wasm-artifacts
      - name: Static symbol check (libxml2/zlib must be linked, not unresolved)
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts
      - name: Live load test in duckdb-wasm (informational until official v1.5.4)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: test/wasm
        run: |
          set -uo pipefail
          timeout 300 npm install --no-save
          mkdir -p repo/v1.5.4/wasm_eh
          cp "$GITHUB_WORKSPACE/wasm-artifacts/webbed-v1.5.4-extension-wasm_eh/webbed.duckdb_extension.wasm" \
             repo/v1.5.4/wasm_eh/
          timeout 240 node load_test.cjs --repo repo --name webbed --platform eh \
            --query "SELECT xml_valid('<a/>') AS ok" --expect '"ok":true'

  # Re-enabled: the repo now passes format-check (the drift it would have failed on
  # was applied separately). Pinned to the same duckdb_version as the stable build --
  # the commented-out version said v1.3.2, long superseded.
  #
  # format only, no tidy: tidy configures CMake without vcpkg, so this extension's
  # libxml2 dependency is not found and the check cannot even configure. Same reason
  # the sibling zim extension runs format only.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v1.5.4
      ci_tools_version: main
      extension_name: webbed
      format_checks: 'format'
