#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    # main only. A branch push and its pull_request run built the same commit
    # twice, doubling queue time; the PR run is the one whose status matters.
    branches: [main]
  pull_request:
  workflow_dispatch:

# event_name is part of the group on purpose. Without it a workflow_dispatch on a
# branch (used to run the canary against a PR) lands in the SAME group as that
# branch's push run -- same ref, same sha -- and cancel-in-progress kills the
# push run, whose cancelled jobs then show on the commit as failures. That made
# a PR read red three times while everything real about it was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN EQUALS THE SHIPPED TAG. Fleet rule (Teague, 2026-09-13): the duckdb
  # submodule is pinned at exactly the commit of the tag the stable build ships
  # against, which is also the version the community registry builds every
  # extension with. Otherwise local builds and each repo's own CI artifacts carry a
  # different DuckDB than the served one, and extensions built in different repos
  # cannot co-load locally (the ABI is exact-version). Measured 2026-09-13: five
  # sibling repos were on a July dev commit, one on a v1.5.6-dev commit, one on
  # DuckDB main. Nothing but a check keeps this true. The second assertion keeps
  # this job's constant from drifting away from the `duckdb_version:` the build
  # jobs above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        run: |
          set -eu
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" .github/workflows/MainDistributionPipeline.yml)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          # The AUTHORITY is the registry's own default, not this job's constant: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetch is
          # not served from the branch cache. TWO degraded paths, deliberately different:
          # UNREACHABLE is the world being unavailable -> a NOTE, and the summary says
          # the assertion was not made; REACHABLE BUT UNPARSEABLE is this check being
          # wrong about the file (renamed input, moved default) -> a FAILURE, because
          # only the check can fix that and a green run measuring nothing is the way
          # this class of check rots (panduck again).
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          sha=$(curl -sf https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          if body=$(curl -sf "https://raw.githubusercontent.com/duckdb/community-extensions/${sha:-main}/.github/workflows/build.yml"); then
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            if [ -z "$registry" ]; then
              echo "::error::community-extensions build.yml at ${sha:-main} was fetched but has no \"inputs.duckdb_version || 'vX.Y.Z'\" default; this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry file fetched but unparseable" >> "$summary"; exit 1
            elif [ "$registry" != "$DUCKDB_VERSION" ]; then
              echo "::error::the community registry builds at ${registry} (build.yml default at ${sha:-main}) but this repo ships and pins ${DUCKDB_VERSION}; the served artifact and the local build differ"
              echo "duckdb-pin: FAILED, registry builds ${registry}, repo pins ${DUCKDB_VERSION}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (${registry} at ${sha:-main})"
          else
            echo "::notice::could not reach the community registry; the pin was checked against the local constant only"
            mode="NOT checked against the registry (unreachable); local constant ${DUCKDB_VERSION} only"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} build job(s) ship it; ${mode}" | tee -a "$summary"

  # Forward-compatibility canary: builds against DuckDB main to give advance warning
  # of upstream API changes. It is EXPECTED to go red whenever main breaks an API this
  # extension uses -- the shippable build is the stable job below.
  #
  # It runs ONLY on pushes to main. Skipping pull_request alone is not enough: pushing
  # to a branch fires a push run AND a pull_request run against the same commit, and a
  # PR's check rollup includes both, so the canary would still show red on every PR.
  #
  # `if` rather than `continue-on-error`: a job calling a REUSABLE WORKFLOW accepts only
  # name/needs/if/permissions/uses/with/secrets/strategy/concurrency, and adding
  # continue-on-error makes the whole workflow fail to PARSE.
  #
  # Currently red on the DuckDB main bind-signature change
  # (unique_ptr<FunctionData> conversions in xml_reader_functions.cpp).
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Same cp1252 reporter crash as the stable job (see below) —
      # duckdb's scripts/ci/run_tests.py emits U+274C ❌ on test-batch
      # failure and Windows' default cp1252 stdout can't encode it,
      # masking the actual test result. Only windows_amd64_mingw is
      # affected; windows_amd64 (MSVC) is re-enabled. Excluded until
      # upstream sets PYTHONIOENCODING / utf8_mode on the mingw runner.
      exclude_archs: 'windows_amd64_mingw'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      # Build target is the v1.5.5 release TAG (loadable/shippable artifacts),
      # even though the duckdb/extension-ci-tools submodule pointers track the
      # v1.5-variegata branch tip. Branch-tip (-dev) builds produce
      # non-loadable extensions; the shippable stable build stays on the tag.
      duckdb_version: v1.5.5
      # ci-tools stays on its v1.5.4 tag: extension-ci-tools has no v1.5.5 tag, and this
      # pins the CI TOOLING, not DuckDB. duckdb_version above is what the build targets.
      ci_tools_version: v1.5-variegata
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # windows_amd64_mingw excluded on the v1.5.5 stable job: duckdb's
      # scripts/ci/run_tests.py prints a U+274C ❌ glyph on test-batch failure,
      # which Windows' default cp1252 stdout can't encode (UnicodeEncodeError),
      # masking the underlying test result. mingw-specific (see duckdb_urlpattern's
      # exclude list); windows_amd64 (MSVC) is re-enabled here.
      # Revisit once upstream sets PYTHONIOENCODING / utf8_mode in the runner.
      exclude_archs: 'windows_amd64_mingw'

  # Guards against the LINKED_LIBS class of WASM bug (issue #96): the reusable
  # distribution workflow builds and uploads the .wasm but never inspects or
  # loads it, so a side module with unresolved libxml2/zlib symbols ships green.
  # Two layers (see test/wasm/):
  #   1. static symbol check (hard gate) — no duckdb-wasm runtime needed.
  #   2. live load+query in duckdb-wasm (informational / continue-on-error) —
  #      expected-red until official duckdb-wasm ships a 1.5.x engine matching
  #      the build target (when this was written the only public 1.5 engine,
  #      haybarn, used a newer emscripten -> lseek ABI skew). Whether that has
  #      changed for v1.5.5 is not known here; the step stays informational.
  wasm-load-test:
    name: WASM load test
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webbed-v1.5.5-extension-wasm_*
          path: wasm-artifacts
      - name: Static symbol check (libxml2/zlib must be linked, not unresolved)
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts
      - name: Live load test in duckdb-wasm (informational until official v1.5.5)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: test/wasm
        run: |
          set -uo pipefail
          timeout 300 npm install --no-save
          mkdir -p repo/v1.5.5/wasm_eh
          cp "$GITHUB_WORKSPACE/wasm-artifacts/webbed-v1.5.5-extension-wasm_eh/webbed.duckdb_extension.wasm" \
             repo/v1.5.5/wasm_eh/
          timeout 240 node load_test.cjs --repo repo --name webbed --platform eh \
            --query "SELECT xml_valid('<a/>') AS ok" --expect '"ok":true'

  # Re-enabled: the repo now passes format-check (the drift it would have failed on
  # was applied separately). Pinned to the same duckdb_version as the stable build --
  # the commented-out version said v1.3.2, long superseded.
  #
  # format only, no tidy: tidy configures CMake without vcpkg, so this extension's
  # libxml2 dependency is not found and the check cannot even configure. Same reason
  # the sibling zim extension runs format only.
  # @main, not @v1.5.4: _extension_code_quality.yml does not exist at the v1.5.4
  # tag of extension-ci-tools (it is newer than that tag), so this job cannot be
  # pinned the way the stable build is. It is the CI tooling ref; duckdb_version
  # below is still the build target.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v1.5.5
      ci_tools_version: main
      extension_name: webbed
      format_checks: 'format'
