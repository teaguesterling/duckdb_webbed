#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    # main only. A branch push and its pull_request run built the same commit
    # twice, doubling queue time; the PR run is the one whose status matters.
    branches: [main]
  pull_request:
  workflow_dispatch:

# event_name is part of the group on purpose. Without it a workflow_dispatch on a
# branch (used to run the canary against a PR) lands in the SAME group as that
# branch's push run -- same ref, same sha -- and cancel-in-progress kills the
# push run, whose cancelled jobs then show on the commit as failures. That made
# a PR read red three times while everything real about it was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE PIN EQUALS THE REGISTRY DEFAULT COMMIT, AND THE WORKFLOW SHIPS THE DEFAULT
  # AND THE VARIANT. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit the community registry builds every extension
  # with by default (build.yml's duckdb_commit, built as its duckdb_version),
  # and this workflow also ships the v1.5 variant the registry still builds
  # (scripts/build.py's variegata route). Otherwise local builds and each repo's
  # own CI artifacts carry a different DuckDB than the served one, and extensions
  # built in different repos cannot co-load locally (the ABI is exact-version).
  # Measured 2026-09-13: five sibling repos were on a July dev commit, one on a
  # v1.5.6-dev commit, one on DuckDB main. Nothing but a check keeps this true.
  # The greps keep this job's constants from drifting away from the
  # `duckdb_commit:` / `duckdb_version:` / `ci_tools_version:` the build jobs below
  # actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_COMMIT: d54cbbe3df17e8e5ce68312f483b4155836112aa
      # The version the build reports, passed as duckdb_version while duckdb_commit
      # selects the checkout. It must be a short release-shaped string: the
      # extension's metadata stamps at most 32 bytes of it, and DuckDB refuses to
      # load a file whose stamp differs from its own version, so a bare 40-char
      # commit as duckdb_version makes every `require webbed` fail
      # (duckdb/community-extensions#3086).
      DUCKDB_VERSION: v2.0.0
      DUCKDB_CI_TOOLS: v2.0-cyanoptera
      DUCKDB_VARIANT: v1.5.6
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      #
      # SET to v1.5.5 because duckdb-legacy-build below targets it. Without this the
      # stray-literal scan fails the guard on that job's own `duckdb_version:` line --
      # which is the mechanism working as designed, not a false positive: an old
      # version literal in this file is exactly what it exists to catch, so the
      # exemption has to be declared deliberately rather than discovered.
      #
      # EMPTY THIS, and delete duckdb-legacy-build, when no supported user is still
      # on v1.5.5. Leaving it set indefinitely re-opens the blind spot it closes.
      DUCKDB_LEGACY: v1.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the registry default commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scans below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          # The pin is compared with the commit directly rather than resolved
          # through ls-remote, so a moved tag cannot hide a stale pin.
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "registry default commit -> ${DUCKDB_COMMIT} (${DUCKDB_VERSION})"
          echo "submodule pin           -> ${have}"
          [ "$DUCKDB_COMMIT" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the registry default commit ${DUCKDB_COMMIT}; run: git -C duckdb fetch origin ${DUCKDB_CI_TOOLS} && git -C duckdb checkout ${DUCKDB_COMMIT}"; exit 1; }
          for want in "duckdb_commit: ${DUCKDB_COMMIT}" "duckdb_version: ${DUCKDB_VERSION}" "ci_tools_version: ${DUCKDB_CI_TOOLS}" "duckdb_version: ${DUCKDB_VARIANT}"; do
            c=$(grep -c "${want}$" "$wf" || true)
            [ "$c" -ge 1 ] || { echo "::error::no build job in this workflow uses ${want}; this job's constants have drifted"; exit 1; }
          done
          # NO OTHER DuckDB VERSION may drift from the shipped ones anywhere else in
          # this file: sibling workflows (yaml, mcp) embed a version in artifact NAMES
          # and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the greps above cannot see, so
          # a bump left them stale and this job went green over a red build. Comment
          # lines (first non-space char `#`) are exempt, and so are `uses:` lines (a
          # `- uses:` list item too): a third-party action pin like `@v2.0.4` is not a
          # DuckDB version. Branch names like `v2.0-cyanoptera` and `v1.5-variegata`
          # have no third numeric component and so never match this pattern. The
          # optional pre-release suffix makes a `v2.0.0-alpha1`-style tag match whole, while
          # `v1.5.6-extension-wasm_eh` in an artifact name still reads as `v1.5.6`.
          # DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          ver_re='v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)[0-9.]*)?'
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE "$ver_re" || true); do
              [ "$v" = "$DUCKDB_VERSION" ] && continue
              [ "$v" = "$DUCKDB_VARIANT" ] && continue
              [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ] && continue
              echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION} or ${DUCKDB_VARIANT}: derive it from the shipped version or bump it"
              bad=1
            done
          done < <(grep -nE "$ver_re" "$wf" || true)
          # The commit appears in duckdb_commit: inputs, which the version scan above
          # cannot see, so a commit bump could leave a stale sha behind. Any 40-hex
          # literal outside comments, `uses:` pins and `vcpkg_commit:` must be it.
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*vcpkg_commit:' && continue
            for h in $(printf '%s\n' "$line" | grep -oE '[0-9a-f]{40}' || true); do
              [ "$h" = "$DUCKDB_COMMIT" ] && continue
              echo "::error::line ${lineno}: ${line} -- a commit literal that is not the registry default ${DUCKDB_COMMIT}: derive it from the pinned commit or bump it"
              bad=1
            done
          done < <(grep -nE '[0-9a-f]{40}' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          url1="${base}/${sha:-main}/.github/workflows/build.yml"
          url2="${base}/${sha:-main}/scripts/build.py"
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "$url1" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "$url2" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_COMMIT:0:10}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            echo "::error::community registry returned HTTP ${code1} for ${url1}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url1}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            echo "::error::community registry returned HTTP ${code2} for ${url2}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url2}" >> "$summary"; exit 1
          else
            # Commented-out lines are dropped first: build.yml keeps a disabled
            # `# duckdb_tag:` line, and parsing it would report a tag nothing builds.
            grep -v '^[[:space:]]*#' "$f1" > "$f1.live" || true
            reg_commit=$(grep -m1 -o "inputs.duckdb_commit || (inputs.duckdb_version == '' && '[0-9a-f]\{40\}'" "$f1.live" | grep -o '[0-9a-f]\{40\}' || true)
            reg_version=$(grep -m1 -oE "^[[:space:]]+duckdb_version: \\$\\{\\{ inputs.duckdb_version \\|\\| 'v[^']*'" "$f1.live" | grep -o "'v[^']*'" | tr -d "'" || true)
            reg_tools=$(grep -m1 -o "inputs.ci_tools_version || '[^']*'" "$f1.live" | grep -o "'[^']*'$" | tr -d "'" || true)
            # build.py routes one DUCKDB_VERSION to each descriptor's `variegata` ref;
            # the version sits in the condition on the line before.
            reg_variant=$(grep -B1 "'variegata' in desc" "$f2" | grep -m1 -o "== 'v[0-9.]*'" | grep -o "v[0-9.]*" || true)
            if [ -z "$reg_commit" ] || [ -z "$reg_version" ] || [ -z "$reg_tools" ] || [ -z "$reg_variant" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build.py carry no recognisable default (commit='${reg_commit}', version='${reg_version}', ci-tools='${reg_tools}', variant='${reg_variant}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            registry="${reg_commit}/${reg_version}/${reg_tools}/${reg_variant}"
            repo="${DUCKDB_COMMIT}/${DUCKDB_VERSION}/${DUCKDB_CI_TOOLS}/${DUCKDB_VARIANT}"
            if [ "$registry" != "$repo" ]; then
              echo "::error::the community registry builds commit/version/ci-tools/variant ${registry} (at ${sha:-main}) but this repo ships ${repo}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry} vs repo ${repo}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${reg_commit:0:10} ${reg_version} on ${reg_tools}, variant ${reg_variant}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_COMMIT:0:10} (${DUCKDB_VERSION}); jobs ship it and ${DUCKDB_VARIANT}; ${mode}" | tee -a "$summary"

  # ADVISORY canary on DuckDB main, the line beyond the shipped v2.0-cyanoptera.
  # Pushes to main and on demand only; it never gates a PR. DuckDB main and
  # v2.0-cyanoptera have diverged both ways (main still has the
  # ConstantExpression(const Value &) constructor cyanoptera deleted), so green
  # here is not evidence for the line the registry ships, and red here is a
  # preview, not a verdict.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  #
  # COMPILE ONLY, ON PURPOSE. Its signal is "does webbed still build against DuckDB
  # main", which is the drift that has actually broken this repo (the Identifier type
  # change, absorbed by duckdb_compat.hpp). It cannot also run the tests:
  #   - Following main means `duckdb_version: main`. Without duckdb_commit, ci-tools
  #     uses duckdb_version as both the checkout ref and the version stamp.
  #   - The engine treats a version without "-dev" as a release and expects the stamp
  #     NormalizeVersionTag("main") = "vmain" (src/main/extension/extension_install.cpp),
  #     but the stamp is "main", so every load is refused. Measured: job 121226073100,
  #     2026-10-25, "ran tests: 0 passed, 130 skipped" with a green check.
  #   - Splitting the two with `duckdb_commit: main` fails at configure: DuckDB main's
  #     CMakeLists.txt takes DUCKDB_COMMIT as the commit hash and requires 10-64 hex
  #     characters ("Invalid DuckDB commit 'main'", job 121265722800).
  # So the tests are skipped explicitly, and the check name says so, rather than
  # skipping silently behind a green check. Test coverage of the next DuckDB line is
  # duckdb-next-build's job.
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary, compile only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      exclude_archs: 'windows_amd64_mingw'
      skip_tests: true

  # The registry default line: the same commit, version and ci-tools branch as
  # community-extensions' build.yml. Artifacts are named from duckdb_version, so
  # they land as `webbed-v2.0.0-extension-<arch>`.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # duckdb's scripts/ci/run_tests.py emits U+274C ❌ on test-batch
      # failure and Windows' default cp1252 stdout can't encode it,
      # masking the actual test result. Only windows_amd64_mingw is
      # affected; windows_amd64 (MSVC) is enabled. Excluded until
      # upstream sets PYTHONIOENCODING / utf8_mode on the mingw runner.
      exclude_archs: 'windows_amd64_mingw'

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require webbed` turns "could not load" into `require webbed: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require webbed\" \"test/*\""}}'
  # V2.0 TEST COVERAGE. The job above matches the registry exactly, which is right
  # for shipping -- but it currently runs ZERO tests. ci-tools @v2.0-cyanoptera
  # drives the unittest binary through duckdb/scripts/ci/run_tests.py
  # (duckdb_extension.Makefile:197-202), and under that wrapper `require webbed`
  # is never satisfied, so all 123 files skip and the step still reports success:
  #     require webbed: 123
  #     ran tests: 0 passed, 123 skipped
  # Filed upstream as duckdb/community-extensions#3086. Measured: ci-tools @main
  # against the same 2.0-line DuckDB DOES run them -- `ran tests: 123 passed,
  # 0 skipped` -- so the coverage is recoverable today rather than blocked on
  # upstream. This job exists only for that signal; it ships nothing.
  #
  # Read `ran tests: N passed` in the log, not the check colour: a green Test
  # step proves nothing while #3086 is open. Delete this job once the job above
  # reports a non-zero count.
  duckdb-v2-test-coverage:
    name: Build extension binaries (v2.0 test coverage)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      # BRANCH NAME, deliberately -- not the registry's commit SHA. Measured on
      # this repo, same ci-tools @main, only this input differing:
      #   duckdb_version: v2.0-cyanoptera  -> ran tests: 123 passed, 0 skipped
      #   duckdb_version: b15358c371daf... -> ran tests: 0 passed, 123 skipped
      # Artifacts are named from duckdb_version, so the SHA form produces
      # `webbed-b15358c371daf...-extension` and `require webbed` cannot load it;
      # every test file then skips and the step still reports success. That is
      # why the registry's own builds show zero tests for every extension.
      # The cost of the branch form: this tests the cyanoptera tip rather than
      # the exact commit the registry ships. Real test evidence on the 2.0 line
      # beats none, and the shipping job above covers the exact commit's COMPILE.
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'
      # Linux only: this job is a test signal, not an artifact source.
      exclude_archs: 'windows_amd64;windows_amd64_mingw;osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads;linux_arm64'

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require webbed` turns "could not load" into `require webbed: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require webbed\" \"test/*\""}}'
  # The v1.5 variant the registry still builds (scripts/build.py routes v1.5.6 to
  # each descriptor's variegata ref). Gating on PRs: v1.5.6 users are the bulk of
  # current installs. The reusable workflow repoints DuckDB itself
  # (`DUCKDB_GIT_VERSION=... make set_duckdb_version`), so this job builds the
  # v1.5.6 tag even though the submodule gitlink is the v2.0 commit.
  duckdb-variegata-build:
    name: Build extension binaries (DuckDB v1.5 variant)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      # The v1.5.6 release TAG (loadable/shippable artifacts). Branch-tip (-dev)
      # builds produce non-loadable extensions.
      duckdb_version: v1.5.6
      # ci-tools pins the v1.5-variegata BRANCH: extension-ci-tools has no v1.5.6 tag,
      # and v1.5-variegata tracks the v1.5.x line. This pins the CI TOOLING, not
      # DuckDB. duckdb_version above is what the build targets.
      ci_tools_version: v1.5-variegata
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'

  # Builds loadable artifacts for the PREVIOUS stable DuckDB, for users who have not
  # moved to the current one. Added when a user on v1.5.5 hit a usability gap
  # (positional extraction, #181) and could not load an artifact built against
  # v1.5.6 -- DuckDB refuses an extension built for a different version, so a fix on
  # main is unreachable to them until they upgrade.
  #
  # workflow_dispatch ONLY. It is not a gate on anything: it produces an artifact on
  # request. Running it per push or per PR would add seven platform legs to every
  # change for a build nothing validates against, and this account's runners are
  # already the scarce resource.
  #
  # Dispatch it against the BRANCH that carries the fix, not main, when the fix has
  # not merged yet -- workflow_dispatch takes a ref, and the job builds whatever that
  # ref contains. The artifact lands as `webbed-v1.5.5-extension-<arch>`, named from
  # duckdb_version, so it cannot be confused with the v1.5.6 artifacts in the same run.
  #
  # The submodule gitlink stays on the registry default commit (d54cbbe) and is NOT
  # touched: the reusable workflow repoints DuckDB itself (`DUCKDB_GIT_VERSION=...
  # make set_duckdb_version`), so the build target comes from duckdb_version below
  # rather than from our pin. That is why this job can coexist with the v2.0 gitlink.
  #
  # UNSIGNED. Artifacts from here are not signed by the community registry, so loading
  # one needs `duckdb -unsigned` or `SET allow_unsigned_extensions=true`.
  duckdb-legacy-build:
    name: Build extension binaries (legacy DuckDB)
    if: github.event_name == 'workflow_dispatch'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      # The previous stable release TAG. Exempted from the stray-literal scan via
      # DUCKDB_LEGACY in duckdb-pin above; the two must be changed together.
      duckdb_version: v1.5.5
      # Same v1.5-variegata ci-tools as duckdb-variegata-build: it tracks the whole v1.5.x
      # line, and extension-ci-tools has no per-patch tags. This pins the TOOLING, not
      # DuckDB -- duckdb_version above is the build target.
      ci_tools_version: v1.5-variegata
      extension_name: webbed
      vcpkg_commit: '68a1c387f660632f2f65cdb7e8cd093a08840e5d'

  # Guards against the LINKED_LIBS class of WASM bug (issue #96): the reusable
  # distribution workflow builds and uploads the .wasm but never inspects or
  # loads it, so a side module with unresolved libxml2/zlib symbols ships green.
  # Two layers (see test/wasm/):
  #   1. static symbol check (hard gate) over both shipped lines' wasm builds —
  #      no duckdb-wasm runtime needed.
  #   2. live load+query in duckdb-wasm (informational / continue-on-error) on
  #      the v1.5.6 build only: no duckdb-wasm engine exists for the v2.0 line.
  #      Expected-red until official duckdb-wasm ships a 1.5.x engine matching
  #      the build target (when this was written the only public 1.5 engine,
  #      haybarn, used a newer emscripten -> lseek ABI skew). Whether that has
  #      changed for v1.5.6 is not known here; the step stays informational.
  wasm-load-test:
    name: WASM load test
    needs: [duckdb-stable-build, duckdb-variegata-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts (v2.0 line)
        uses: actions/download-artifact@v4
        with:
          pattern: webbed-v2.0.0-extension-wasm_*
          path: wasm-artifacts
      - name: Download WASM artifacts (v1.5 variant)
        uses: actions/download-artifact@v4
        with:
          pattern: webbed-v1.5.6-extension-wasm_*
          path: wasm-artifacts
      - name: Static symbol check (libxml2/zlib must be linked, not unresolved)
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts
      - name: Live load test in duckdb-wasm (informational until official v1.5.6)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: test/wasm
        run: |
          set -uo pipefail
          timeout 300 npm install --no-save
          mkdir -p repo/v1.5.6/wasm_eh
          cp "$GITHUB_WORKSPACE/wasm-artifacts/webbed-v1.5.6-extension-wasm_eh/webbed.duckdb_extension.wasm" \
             repo/v1.5.6/wasm_eh/
          timeout 240 node load_test.cjs --repo repo --name webbed --platform eh \
            --query "SELECT xml_valid('<a/>') AS ok" --expect '"ok":true'

  # Re-enabled: the repo now passes format-check (the drift it would have failed on
  # was applied separately). Pinned to the same duckdb_version as the stable build --
  # the commented-out version said v1.3.2, long superseded.
  #
  # format only, no tidy: tidy configures CMake without vcpkg, so this extension's
  # libxml2 dependency is not found and the check cannot even configure. Same reason
  # the sibling zim extension runs format only.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: webbed
      format_checks: 'format'
